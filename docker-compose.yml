# Nom du projet Compose figé : les volumes (pgdata, miniodata) existants sont ceux de `video_virale-v1`.
name: video_virale-v1
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: vv, POSTGRES_PASSWORD: vv, POSTGRES_DB: video_virale }
    ports: ["127.0.0.1:5432:5432"]  # liaison locale uniquement (identifiants de dev)
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  minio:
    # MinIO n'est plus publié sur Docker Hub : RustFS offre la même API S3 (service gardé sous le nom « minio »).
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment: { RUSTFS_ACCESS_KEY: minioadmin, RUSTFS_SECRET_KEY: minioadmin }
    ports: ["127.0.0.1:9100:9000"]
    volumes: [miniodata:/data]
volumes: { pgdata: {}, miniodata: {} }
